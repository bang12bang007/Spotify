name: flutter_application_1
description: "Spotify"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  hydrated_bloc: ^11.0.0
  path_provider: ^2.0.14
  flutter_svg: ^2.0.0
  firebase_auth: ^6.5.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.14.1
flutter_gen:
  output: lib/generates/
  integrations:
    flutter_svg: true
flutter:
  uses-material-design: true

  # Khai báo các tài nguyên sử dụng trong dự án
  assets:
    - assets/fonts/
    - assets/images/
    - assets/svg/


  # Khai báo custom fonts
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
        - asset: assets/fonts/OpenSans-ExtraBoldItalic.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
        - asset: assets/fonts/OpenSans-Light.ttf
        - asset: assets/fonts/OpenSans-LightItalic.ttf
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Semibold.ttf
        - asset: assets/fonts/OpenSans-SemiboldItalic.ttf
